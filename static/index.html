<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>化工装置变更与工艺安全管理</title>
  <style>
    :root { --line:#e5e7eb; --muted:#6b7280; --bg:#f9fafb; --blue:#2563eb; --red:#dc2626; --green:#16a34a; --amber:#d97706; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; color: #1f2937; background: var(--bg); }
    header { background: #111827; color: #fff; padding: .8rem 1.2rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    header h1 { font-size: 1.05rem; margin: 0; flex: 1; }
    header input, header select { padding: .35rem .5rem; border-radius: 6px; border: 1px solid #4b5563; background: #fff; }
    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 1rem; padding: 1rem; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    .card h2 { font-size: .95rem; margin: 0 0 .7rem; display: flex; justify-content: space-between; align-items: center; }
    .row { display: flex; gap: .5rem; margin-bottom: .5rem; flex-wrap: wrap; align-items: center; }
    input, select, textarea { padding: .4rem .55rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .85rem; font-family: inherit; }
    input[type=text], input[type=password], textarea { width: 100%; }
    .grow { flex: 1; min-width: 120px; }
    button { padding: .42rem .75rem; border: none; border-radius: 6px; background: var(--blue); color: #fff; cursor: pointer; font-size: .82rem; }
    button.secondary { background: #6b7280; }
    button.danger { background: var(--red); }
    button.warn { background: var(--amber); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .entity { border: 1px solid var(--line); border-radius: 8px; padding: .6rem .7rem; margin-bottom: .5rem; cursor: pointer; }
    .entity:hover, .entity.active { border-color: var(--blue); background: #eff6ff; }
    .entity .name { font-weight: 600; font-size: .88rem; }
    .entity .sub { font-size: .78rem; color: var(--muted); margin-top: .15rem; }
    .badge { display: inline-block; padding: .1rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 600; }
    .b-operating, .b-commissioned, .b-confirmed, .b-verified, .b-closed { background:#dcfce7; color:#166534; }
    .b-shutdown, .b-rolled_back { background:#fee2e2; color:#991b1b; }
    .b-frozen { background:#fef3c7; color:#92400e; }
    .b-draft, .b-open, .b-pending { background:#e5e7eb; color:#374151; }
    .b-assessed, .b-completed, .b-restored { background:#dbeafe; color:#1e40af; }
    .b-approved, .b-implemented { background:#ede9fe; color:#5b21b6; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th, td { border-bottom: 1px solid var(--line); padding: .4rem .45rem; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); font-size: .8rem; }
    .hint { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: .5rem .7rem; border-radius: 6px; font-size: .8rem; margin: .5rem 0; }
    .err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: .5rem .7rem; border-radius: 6px; font-size: .8rem; margin: .5rem 0; white-space: pre-wrap; }
    .ok { background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; padding:.5rem .7rem; border-radius:6px; font-size:.8rem; margin:.5rem 0; }
    .kv { display: grid; grid-template-columns: 110px 1fr; gap: .3rem .8rem; font-size: .85rem; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; }
    .mini { font-size: .76rem; padding: .22rem .5rem; }
    .progress { height: 8px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
    .progress > div { height: 100%; background: var(--green); }
    .audit { font-size: .76rem; color: var(--muted); border-left: 2px solid var(--line); padding: .15rem 0 .15rem .7rem; margin-bottom: .55rem; }
    .audit b { color: #374151; }
    .rowline { display:flex; gap:.4rem; margin-bottom:.35rem; }
    .toast-wrap { position: fixed; right: 1rem; bottom: 1rem; display: flex; flex-direction: column; gap: .4rem; z-index: 50; }
    label.chk { display:flex; gap:.35rem; align-items:center; font-size:.85rem; }
  </style>
</head>
<body>
<header>
  <h1>化工装置变更与工艺安全管理</h1>
  <label class="muted" style="color:#d1d5db">用户</label>
  <input id="userId" type="text" value="admin" style="width:120px">
  <select id="role">
    <option value="admin">管理员 admin</option>
    <option value="engineer">工程师 engineer</option>
    <option value="safety">安全员 safety</option>
    <option value="operator">操作员 operator</option>
    <option value="verifier">复核员 verifier</option>
    <option value="viewer">观察者 viewer</option>
  </select>
  <button class="secondary" onclick="loadAll()">刷新</button>
</header>

<div class="layout">
  <div>
    <div class="card">
      <h2>装置 <span class="muted" id="unitCount"></span></h2>
      <div id="unitList"></div>
      <div class="row" style="margin-top:.6rem">
        <input type="text" id="newUnitName" placeholder="装置名称" class="grow">
        <input type="text" id="newUnitLoc" placeholder="位置">
        <button onclick="createUnit()">新建</button>
      </div>
    </div>
    <div class="card">
      <h2>变更 <span class="muted" id="changeCount"></span></h2>
      <div id="changeList"></div>
      <div class="row" style="margin-top:.6rem">
        <select id="newChangeUnit" class="grow"></select>
        <button onclick="createChange()">新建变更</button>
      </div>
      <input type="text" id="newChangeDesc" placeholder="变更描述（如：修改报警联锁阈值）">
    </div>
  </div>

  <div id="detail">
    <div class="card"><p class="muted">从左侧选择一个变更查看详情。回退后的变更在此逐项填写恢复结果并复核；清单全部确认完成后才能关闭变更。</p></div>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>

<script>
const STATUS_LABEL = {
  operating: '运行中', shutdown: '停机', frozen: '冻结',
  draft: '草稿', assessed: '已评估', approved: '已批准', implemented: '已实施',
  commissioned: '已投用', rolled_back: '已回退', closed: '已关闭',
  open: '待处理', completed: '已完成', verified: '已验证',
  pending: '待恢复', restored: '待复核', confirmed: '已确认'
};
const state = { units: [], changes: [], selected: null, msg: null, msgKind: null };

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function badge(s) { return `<span class="badge b-${esc(s)}">${esc(STATUS_LABEL[s] || s)}</span>`; }
function actor() { return { 'X-User-Id': document.getElementById('userId').value || 'anonymous', 'X-Role': document.getElementById('role').value }; }

async function api(path, opts = {}) {
  const res = await fetch(path, Object.assign({ headers: Object.assign({ 'Content-Type': 'application/json' }, actor()) }, opts));
  const payload = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((payload && payload.error) || ('HTTP ' + res.status));
  return payload;
}
function toast(text, ok) {
  const el = document.createElement('div');
  el.className = ok ? 'ok' : 'err';
  el.textContent = text;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 5000);
}
async function call(path, body, method = 'POST') {
  try {
    await api(path, { method, body: JSON.stringify(body || {}) });
    await loadAll();
  } catch (e) { toast(e.message, false); }
}
async function act(entityId, action, data, expectedVersion) {
  const body = { action, data: data || {} };
  if (expectedVersion != null) body.expected_version = expectedVersion;
  await call('/api/entities/' + encodeURIComponent(entityId) + '/actions', body);
}

async function loadAll() {
  try {
    const [units, changes, actionItems] = await Promise.all([
      api('/api/units'), api('/api/changes'), api('/api/action_items')
    ]);
    state.units = units.items;
    state.changes = changes.items;
    state.actionItems = actionItems.items;
    if (state.selected && !state.changes.some(c => c.id === state.selected)) state.selected = null;
    renderUnits();
    renderChanges();
    await renderDetail();
  } catch (e) { toast(e.message, false); }
}

function renderUnits() {
  document.getElementById('unitCount').textContent = state.units.length + ' 台';
  document.getElementById('unitList').innerHTML = state.units.map(u => `
    <div class="entity">
      <div class="name">${esc(u.data.name)} ${badge(u.status)}</div>
      <div class="sub">${esc(u.data.location || '')} · ${esc(u.id.slice(0,8))}</div>
      <div class="row" style="margin-top:.4rem">${unitButtons(u)}</div>
    </div>`).join('') || '<p class="muted">暂无装置</p>';
  const sel = document.getElementById('newChangeUnit');
  sel.innerHTML = state.units.map(u => `<option value="${esc(u.id)}">${esc(u.data.name)}（${esc(STATUS_LABEL[u.status])}）</option>`).join('');
}
function unitButtons(u) {
  if (u.status === 'operating')
    return `<button class="mini warn" onclick="unitAction('${esc(u.id)}','shutdown','停机原因')">停机</button>
            <button class="mini secondary" onclick="unitAction('${esc(u.id)}','freeze','冻结原因')">冻结</button>`;
  if (u.status === 'shutdown')
    return `<button class="mini" onclick="unitAction('${esc(u.id)}','startup','启动说明')">启动</button>`;
  if (u.status === 'frozen')
    return `<button class="mini" onclick="unitAction('${esc(u.id)}','unfreeze','解冻说明')">解冻</button>`;
  return '';
}
async function unitAction(id, action, promptText) {
  const reason = window.prompt(promptText);
  if (reason == null) return;
  await act(id, action, { reason });
}
async function createUnit() {
  const name = document.getElementById('newUnitName').value.trim();
  const location = document.getElementById('newUnitLoc').value.trim();
  if (!name) return toast('装置名称必填', false);
  document.getElementById('newUnitName').value = '';
  document.getElementById('newUnitLoc').value = '';
  await call('/api/units', { name, location });
}

function renderChanges() {
  document.getElementById('changeCount').textContent = state.changes.length + ' 项';
  document.getElementById('changeList').innerHTML = state.changes.map(c => {
    const unit = state.units.find(u => u.id === c.data.unit_id);
    return `<div class="entity ${state.selected === c.id ? 'active' : ''}" onclick="selectChange('${esc(c.id)}')">
      <div class="name">${esc(c.data.description || '(无描述)')} ${badge(c.status)}</div>
      <div class="sub">${esc(unit ? unit.data.name : c.data.unit_id)} · v${c.version} · ${esc(c.id.slice(0,8))}</div>
    </div>`;
  }).join('') || '<p class="muted">暂无变更</p>';
}
async function createChange() {
  const unit_id = document.getElementById('newChangeUnit').value;
  const description = document.getElementById('newChangeDesc').value.trim();
  if (!unit_id) return toast('请先建设备', false);
  if (!description) return toast('变更描述必填', false);
  document.getElementById('newChangeDesc').value = '';
  await call('/api/changes', { unit_id, description });
}
function selectChange(id) { state.selected = id; renderChanges(); renderDetail(); }

function rowsEditor(id, cols) {
  return `<div id="${id}"></div>
  <button type="button" class="mini secondary" onclick="addRow('${id}',${JSON.stringify(cols).replace(/"/g,'&quot;')})">+ 添加一行</button>`;
}
function addRow(id, cols) {
  const wrap = document.getElementById(id);
  const div = document.createElement('div');
  div.className = 'rowline';
  div.innerHTML = cols.map(c =>
    `<input data-k="${esc(c.k)}" placeholder="${esc(c.ph)}" class="grow" style="min-width:90px">`
  ).join('') + '<button type="button" class="mini secondary" onclick="this.parentNode.remove()">×</button>';
  wrap.appendChild(div);
}
function collectRows(id) {
  return [...document.querySelectorAll('#' + id + ' .rowline')].map(r => {
    const o = {};
    r.querySelectorAll('input').forEach(i => { o[i.dataset.k] = i.value.trim(); });
    return o;
  }).filter(o => o.name);
}

async function renderDetail() {
  const host = document.getElementById('detail');
  if (!state.selected) return;
  const c = state.changes.find(x => x.id === state.selected);
  if (!c) return;
  const unit = state.units.find(u => u.id === c.data.unit_id);
  const [recovery, audit] = await Promise.all([
    api('/api/entities/' + encodeURIComponent(c.id) + '/recovery-items'),
    api('/api/audit?entity_id=' + encodeURIComponent(c.id))
  ]);
  const items = state.actionItems.filter(i => i.data.change_id === c.id);
  const recItems = recovery.items;

  host.innerHTML = `
    <div class="card">
      <h2>变更详情 ${badge(c.status)}</h2>
      <dl class="kv">
        <dt>描述</dt><dd>${esc(c.data.description)}</dd>
        <dt>装置</dt><dd>${esc(unit ? unit.data.name : c.data.unit_id)} ${unit ? badge(unit.status) : ''}</dd>
        <dt>变更编号</dt><dd class="muted">${esc(c.id)}</dd>
        <dt>版本</dt><dd>v${c.version}</dd>
        <dt>恢复负责人</dt><dd>${esc(c.data.recovery_owner || '— 实施前指定 —')}</dd>
      </dl>
      <div id="workflow"></div>
    </div>
    ${c.data.baseline ? baselineCard(c, unit) : ''}
    ${recItems.length ? recoveryCard(c, unit, recItems) : ''}
    ${actionItemCard(c, items)}
    <div class="card"><h2>审计时间线</h2>${
      audit.items.map(a => `<div class="audit"><b>${esc(a.action)}</b> ${a.from_status ? esc(STATUS_LABEL[a.from_status]||a.from_status)+' → ' : ''}${esc(STATUS_LABEL[a.to_status]||a.to_status)} · ${esc(a.actor_id)}（${esc(a.actor_role)}） · ${esc(a.created_at)}</div>`).join('') || '<p class="muted">暂无记录</p>'
    }</div>`;

  document.getElementById('workflow').innerHTML = workflowForms(c, unit);
}

function workflowForms(c, unit) {
  const s = c.status;
  if (s === 'draft') return `
    <div class="row" style="margin-top:.6rem">
      <select id="f-risk" class="grow">
        <option value="low">低风险 low（1 人批准）</option>
        <option value="medium" selected>中风险 medium（2 人批准）</option>
        <option value="high">高风险 high（3 人批准）</option>
        <option value="critical">极高风险 critical（4 人批准）</option>
      </select>
      <input id="f-analyst" placeholder="分析人" value="${esc(document.getElementById('userId').value)}">
      <button onclick="doAssess('${esc(c.id)}',${c.version})">风险评估</button>
    </div>`;
  if (s === 'assessed') return `
    <div class="row" style="margin-top:.6rem">
      <input id="f-approvals" placeholder="批准人，逗号分隔（如 S-1,S-2）" class="grow">
      <input id="f-permit" placeholder="作业许可号 permit_id">
      <button onclick="doApprove('${esc(c.id)}',${c.version})">批准</button>
    </div>`;
  if (s === 'approved') return `
    <div class="hint">实施前必须保存：受影响装置当前状态、关键工艺参数原值、隔离措施原状，并指定恢复负责人。回退时将据此逐项生成恢复清单。</div>
    <div class="row"><input id="f-proc" placeholder="作业方案版本 procedure_version（如 v2）" class="grow"></div>
    <div class="row"><label class="chk">恢复负责人</label><input id="f-owner" value="${esc(document.getElementById('userId').value)}" style="max-width:220px"></div>
    <div class="row"><strong class="muted" style="width:100%">关键工艺参数（参数名 / 原值 / 单位）</strong></div>
    ${rowsEditor('ed-params', [{k:'name',ph:'参数名'},{k:'baseline',ph:'原值/原设定'},{k:'unit',ph:'单位'}])}
    <div class="row" style="margin-top:.5rem"><strong class="muted" style="width:100%">隔离措施（措施 / 原状）</strong></div>
    ${rowsEditor('ed-iso', [{k:'name',ph:'隔离措施（阀/盲板/联锁）'},{k:'baseline',ph:'原状（如：闸阀全开）'}])}
    <div class="row" style="margin-top:.6rem"><button onclick="doImplement('${esc(c.id)}',${c.version})">保存基线并实施</button></div>`;
  if (s === 'implemented' || s === 'commissioned') return `
    <div class="row" style="margin-top:.6rem">
      ${s === 'implemented'
        ? `<label class="chk"><input type="checkbox" id="f-tests" checked> 投用测试通过</label>
           <button onclick="doCommission('${esc(c.id)}',${c.version})">确认投用</button>` : ''}
      <input id="f-reason" placeholder="回退原因（投用效果不对）" class="grow">
      <button class="danger" onclick="doRollback('${esc(c.id)}',${c.version})">回退并生成恢复清单</button>
    </div>`;
  if (s === 'rolled_back') return `
    <div class="row" style="margin-top:.6rem">
      <input id="f-outcome" placeholder="关闭结论 outcome" class="grow">
      <button onclick="doClose('${esc(c.id)}',${c.version})">关闭变更</button>
    </div>
    <p class="muted">恢复清单全部逐项确认完成后才允许关闭。</p>`;
  return '<p class="ok">变更已关闭。</p>';
}

function baselineCard(c, unit) {
  const b = c.data.baseline;
  return `<div class="card">
    <h2>实施前基线快照</h2>
    <dl class="kv">
      <dt>快照时间</dt><dd>${esc(b.captured_at)}</dd>
      <dt>保存人</dt><dd>${esc(b.captured_by)}</dd>
      <dt>装置当时状态</dt><dd>${esc(b.unit_name)} ${badge(b.unit_status)}</dd>
      <dt>实施人</dt><dd>${esc(c.data.implemented_by)}</dd>
      <dt>恢复负责人</dt><dd>${esc(c.data.recovery_owner)}</dd>
    </dl>
    <div class="row" style="margin-top:.5rem"><strong class="muted">关键工艺参数原值</strong></div>
    <table><tr><th>参数</th><th>原值</th><th>单位</th></tr>
      ${b.parameters.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.baseline)}</td><td>${esc(p.unit)}</td></tr>`).join('')}
    </table>
    <div class="row" style="margin-top:.5rem"><strong class="muted">隔离措施原状</strong></div>
    <table><tr><th>措施</th><th>原状</th></tr>
      ${b.isolations.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.baseline)}</td></tr>`).join('')}
    </table>
  </div>`;
}

function recoveryCard(c, unit, recItems) {
  const done = recItems.filter(i => i.status === 'confirmed').length;
  const pct = Math.round(done / recItems.length * 100);
  const shutdown = unit && (unit.status === 'shutdown' || unit.status === 'frozen');
  return `<div class="card">
    <h2>回退恢复清单（逐项确认） <span class="muted">${done}/${recItems.length}</span></h2>
    <div class="progress" style="margin-bottom:.6rem"><div style="width:${pct}%"></div></div>
    <div class="hint">
      恢复人逐项填写恢复结果并提交，随后由他人复核确认——<b>恢复人本人不能自审</b>。
      ${shutdown
        ? `当前装置为<b>${esc(STATUS_LABEL[unit.status])}</b>状态：每项必须由<b>未参加本次实施</b>的<b>安全员（safety）</b>复核；实施人 ${esc(c.data.implemented_by)} 不能复核。`
        : '装置已恢复运行时，可由非恢复人的工程师/安全员/复核员复核。'}
    </div>
    <table>
      <tr><th style="width:52px">编号</th><th>类别</th><th>项目</th><th>应恢复到</th><th>状态</th><th style="min-width:240px">恢复结果与复核</th></tr>
      ${recItems.map(i => recoveryRow(c, i)).join('')}
    </table>
  </div>`;
}
function recoveryRow(c, i) {
  const d = i.data;
  let action = '';
  if (i.status === 'pending') {
    action = `<textarea id="r-${esc(i.id)}" placeholder="恢复结果（如：阀位已恢复全开，参数 DCS 已抄录核对）" rows="2"></textarea>
      <div class="row" style="margin:.3rem 0 0">
        <button class="mini" onclick="doRestore('${esc(i.id)}',${i.version})">恢复人提交（${esc(d.owner)}）</button>
      </div>
      <p class="muted" style="margin:.3rem 0 0">仅恢复负责人本人可提交。</p>`;
  } else if (i.status === 'restored') {
    action = `<div class="ok" style="margin:0 0 .35rem">结果：${esc(d.result)}<br>恢复人 ${esc(d.restored_by)} · ${esc(d.restored_at)}</div>
      <button class="mini" onclick="doConfirm('${esc(i.id)}',${i.version})">复核确认</button>
      <button class="mini secondary" onclick="doReject('${esc(i.id)}',${i.version})">驳回重做</button>`;
  } else {
    action = `<div class="ok" style="margin:0">结果：${esc(d.result)}<br>恢复人 ${esc(d.restored_by)}；复核 ${esc(d.confirmed_by)} · ${esc(d.confirmed_at)}</div>`;
  }
  return `<tr>
    <td>${esc(d.ref)}</td>
    <td>${esc(d.label)}</td>
    <td>${esc(d.name)}${d.unit ? ' (' + esc(d.unit) + ')' : ''}</td>
    <td>${esc(d.baseline)}</td>
    <td>${badge(i.status)}</td>
    <td>${action}</td>
  </tr>`;
}

function actionItemCard(c, items) {
  if (!['implemented', 'commissioned', 'rolled_back', 'closed'].includes(c.status) && items.length === 0) return '';
  return `<div class="card">
    <h2>风险控制行动项 <span class="muted">投用前须全部验证</span></h2>
    ${items.map(i => `
      <div class="row">
        <span class="grow">${esc(i.data.description)} <span class="muted">(${esc(i.data.owner)})</span> ${badge(i.status)}</span>
        ${i.status === 'open' ? `<button class="mini" onclick="doItemComplete('${esc(i.id)}',${i.version})">完成</button>` : ''}
        ${i.status === 'completed' ? `<button class="mini" onclick="doItemVerify('${esc(i.id)}',${i.version})">验证</button>` : ''}
      </div>`).join('') || '<p class="muted">暂无行动项</p>'}
    ${['draft','assessed','approved','implemented'].includes(c.status) ? `
      <div class="row" style="margin-top:.5rem">
        <input id="ai-desc" placeholder="行动项描述" class="grow">
        <input id="ai-owner" placeholder="负责人" style="max-width:140px">
        <button class="secondary" onclick="createItem('${esc(c.id)}')">添加</button>
      </div>` : ''}
  </div>`;
}

async function doAssess(id, ver) {
  await act(id, 'assess', { risk_level: document.getElementById('f-risk').value, analyst: document.getElementById('f-analyst').value.trim() }, ver);
}
async function doApprove(id, ver) {
  const approvals = document.getElementById('f-approvals').value.split(',').map(s => s.trim()).filter(Boolean);
  const permit_id = document.getElementById('f-permit').value.trim();
  await act(id, 'approve', { approvals, permit_id }, ver);
}
async function doImplement(id, ver) {
  const procedure_version = document.getElementById('f-proc').value.trim();
  const recovery_owner = document.getElementById('f-owner').value.trim();
  const parameters = collectRows('ed-params').map(p => ({ name: p.name, baseline: p.baseline, unit: p.unit || '' }));
  const isolations = collectRows('ed-iso').map(p => ({ name: p.name, baseline: p.baseline }));
  if (!procedure_version) return toast('作业方案版本必填', false);
  if (!recovery_owner) return toast('必须指定恢复负责人', false);
  if (!parameters.length && !isolations.length) return toast('至少录入一项工艺参数原值或隔离措施原状', false);
  if ([...parameters, ...isolations].some(p => !p.baseline)) return toast('每行都必须填写原值/原状', false);
  await act(id, 'implement', { procedure_version, recovery_owner, parameters, isolations }, ver);
}
async function doCommission(id, ver) {
  await act(id, 'commission', { tests_passed: document.getElementById('f-tests').checked }, ver);
}
async function doRollback(id, ver) {
  const reason = document.getElementById('f-reason').value.trim();
  if (!reason) return toast('回退原因必填', false);
  await act(id, 'rollback', { reason }, ver);
}
async function doClose(id, ver) {
  const outcome = document.getElementById('f-outcome').value.trim();
  if (!outcome) return toast('关闭结论必填', false);
  await act(id, 'close', { outcome }, ver);
}
async function doRestore(id, ver) {
  const result = document.getElementById('r-' + id).value.trim();
  if (!result) return toast('请填写恢复结果', false);
  await act(id, 'restore', { result }, ver);
}
async function doConfirm(id, ver) { await act(id, 'confirm_restore', {}, ver); }
async function doReject(id, ver) {
  const reason = window.prompt('驳回原因');
  if (reason == null) return;
  await act(id, 'reject_restore', { reason }, ver);
}
async function doItemComplete(id, ver) {
  await act(id, 'complete', { completed_by: document.getElementById('userId').value, evidence: 'field-record' }, ver);
}
async function doItemVerify(id, ver) {
  await act(id, 'verify', { verifier: document.getElementById('userId').value }, ver);
}
async function createItem(changeId) {
  const description = document.getElementById('ai-desc').value.trim();
  const owner = document.getElementById('ai-owner').value.trim();
  if (!description || !owner) return toast('行动项描述和负责人必填', false);
  await call('/api/action_items', { change_id: changeId, description, owner });
}

document.getElementById('userId').addEventListener('change', loadAll);
document.getElementById('role').addEventListener('change', loadAll);
loadAll();
</script>
</body>
</html>
